# Barrios monitoreados, por rol (PLAN-radar-inmobiliario.md, sección 5).
#
# meli_slug: slug de URL de inmuebles.mercadolibre.com.ar, confirmado en vivo
# (todos devolvieron 200 con avisos reales al momento de escribir esto).
# Si Mercado Libre cambia sus URLs, ajustar acá — nunca en el código.
#
# Se reusa el mismo valor como slug para Zonaprop/Argenprop (ambos usan el
# mismo formato simple de nombre de barrio en minúsculas). Confirmado en
# vivo SOLO para Monte Castro al escribir esto — si algún otro barrio no
# resuelve bien en esos dos portales, es acá donde ajustar (agregar un
# campo `zonaprop_slug`/`argenprop_slug` si hiciera falta divergir).

nucleo:            # barrios de alerta activa
  - nombre: "Velez Sarsfield"
    meli_slug: "velez-sarsfield"
  - nombre: "Floresta"
    meli_slug: "floresta"

propia:             # donde está la propiedad a vender
  - nombre: "Monte Castro"
    meli_slug: "monte-castro"

anillo:             # solo para densificar el modelo, no genera alertas propias
  - nombre: "Flores"
    meli_slug: "flores"
  - nombre: "Villa Luro"
    meli_slug: "villa-luro"
  - nombre: "Villa Santa Rita"
    meli_slug: "villa-santa-rita"
  - nombre: "Villa Real"
    meli_slug: "villa-real"
  - nombre: "Versalles"
    meli_slug: "versalles"
  - nombre: "Villa del Parque"
    meli_slug: "villa-del-parque"

tipologias:         # separadas siempre, nunca mezcladas en un comparable
  - "departamento"
  - "ph"
  - "casa"

# Zonas fuera del universo de candidatas (nucleo/propia/anillo, todas CABA):
# se scrapean solo para auditar la propiedad de un perfil puntual contra sus
# propios comparables (ver config/mi_propiedad_papa.yaml, analysis/valuation.py).
# NUNCA aparecen en la tabla de candidatas del sitio (ingest/snapshot.py marca
# cada fila con `zona_externa: true`, analysis/latest.py las excluye de
# `visible`) — solo alimentan comparables_pool para el audit_property() de
# ese perfil. Por eso `tipologias` es específico por zona (acá solo "casa":
# no hace falta pagar el costo de scrapear departamentos/PH de una zona en la
# que nadie compra) y `meli_region` es obligatorio (a diferencia de
# nucleo/propia/anillo, que asumen "capital-federal" fijo en
# ingest/meli_scraper.py).
#
# Merlo (partido de Buenos Aires, GBA Oeste): confirmado en vivo (2026-09-14)
# que Mercado Libre NO resuelve con la región "capital-federal" de siempre —
# hace falta "bsas-gba-oeste". Solo Mercado Libre por ahora: Zonaprop/Argenprop
# devuelven el mismo bloqueo Cloudflare/WAF de siempre para CABA, sin
# confirmar todavía si el slug funciona igual para un partido de provincia —
# se agrega cuando haga falta más volumen de comparables.
externas:
  - nombre: "Merlo"
    meli_slug: "merlo"
    meli_region: "bsas-gba-oeste"
    tipologias: ["casa"]

# Perímetro por barrio (ingest/perimetro.py): polígono [[lat, lon], ...] que
# acota la búsqueda dentro de un barrio. Los avisos fuera quedan guardados pero
# marcados `fuera_de_perimetro` y no se muestran ni cuentan como comparables.
# Sin entrada (o polígono vacío) el barrio no se filtra. Un aviso sin
# coordenadas no se oculta (no hay dato para decidirlo). Solo Mercado Libre
# aporta coordenadas por ahora (Zonaprop trae calle/altura, no lat/lon).
perimetros: {}
  # Floresta:
  #   - [-34.63, -58.48]   # esquina 1
  #   - ...

# Alcance reducido a pedido del usuario (2026-09-09), para poder iterar y
# detectar problemas/mejoras más fácil con un universo más chico — "luego
# escalamos". Aplica a TODO el proyecto (scraping, dedupe, F4, sitio), no
# solo a un portal: ver ingest/snapshot.py (all_barrios, filtro de
# ambientes_min). Para volver a escalar: anillo_activo -> true,
# ambientes_min -> null.
#
# ambientes_min bajado de 3 a 2 (2026-09-14, a pedido del usuario): habilita
# la búsqueda de 2 ambientes de otro perfil (ver config/mi_propiedad_papa.yaml)
# sin abrir geografía nueva. Las filas de `externas` (arriba) están exentas
# de este filtro — ver ingest/snapshot.py::apply_alcance_filter — porque
# alimentan comparables, no candidatas, y no tiene sentido descartar una casa
# comparable de Merlo por no informar "ambientes".
alcance:
  anillo_activo: false   # solo se scrapea nucleo (Velez Sarsfield, Floresta) + propia (Monte Castro)
  ambientes_min: 2       # descarta avisos de 1 ambiente y los que no informan ambientes

# F4 (analysis/valuation.py): a qué barrios se expande la búsqueda de
# comparables cuando el barrio solo no llega a 30 avisos. Geografía general
# de CABA curada a mano, NO medida (sin geohash/lat-lon todavía) — es una
# aproximación razonable, no un dato verificado. Antes de confiar en un
# veredicto que dependió de esta expansión, vale la pena confirmarlo con
# alguien que conozca la zona (ver PLAN-radar-inmobiliario.md sección 14).
adyacentes:
  "Monte Castro": ["Velez Sarsfield", "Floresta", "Villa Real", "Versalles"]
  "Velez Sarsfield": ["Monte Castro", "Floresta", "Versalles", "Villa Luro"]
  "Floresta": ["Monte Castro", "Velez Sarsfield", "Flores", "Villa Luro"]
  "Flores": ["Floresta", "Villa Luro", "Villa Santa Rita"]
  "Villa Luro": ["Floresta", "Velez Sarsfield", "Villa Real", "Flores"]
  "Villa Santa Rita": ["Flores", "Villa del Parque"]
  "Villa Real": ["Monte Castro", "Villa Luro", "Versalles"]
  "Versalles": ["Monte Castro", "Velez Sarsfield", "Villa Real", "Villa del Parque"]
  "Villa del Parque": ["Versalles", "Villa Santa Rita"]

outliers:
  usd_m2_min: 400
  usd_m2_max: 8000
  # Piso absoluto de precio, independiente de usd_m2 — hace falta porque
  # el chequeo de usd_m2 nunca corre sobre Zonaprop (no expone m2_cubiertos
  # en el listado, ver zonaprop_scraper.py) y un precio absurdo ahí
  # pasaba sin ninguna alerta. Ningún departamento/PH/casa real en CABA
  # baja de esto — un valor menor es casi siempre un bug de parseo
  # (moneda mal detectada, número truncado).
  price_usd_min: 5000

scraping:
  # La página de listado (barata: 1 request cada 48 avisos) se recorre
  # completa todos los días. La página de DETALLE de cada aviso (cara: 1
  # request por aviso) solo se pide para avisos nuevos, hasta este tope por
  # corrida, repartido parejo entre las ~27 combinaciones barrio x tipología
  # (ver ingest/snapshot.py). Con el backlog inicial real (~7.200 avisos),
  # 1000/día tarda ~50 min por corrida y cubre el backlog en ~7 días —
  # decisión explícita del usuario: prioriza corridas cortas sobre terminar
  # el backlog rápido (bajado de 3000, que tardaba ~2.5hs por corrida).
  max_new_detail_fetches_por_corrida: 1000

  # F3 (dedupe, ingest/dedupe.py): pHash de fotos, la única parte que pega
  # a la red. Se calcula solo para avisos nuevos (se reusa el hash ya
  # calculado antes), con este tope diario por la misma razón que el de
  # arriba: no descargar miles de fotos de golpe.
  max_new_phash_fetches_por_corrida: 500

  # Palabras clave (ingest/keywords.py): la descripción completa de un
  # aviso solo está en su página de DETALLE (no en el listado, a pesar de
  # que el resto de los datos de Zonaprop sí estén ahí) — mismo costo por
  # aviso que el detalle de ML. Por ahora solo Zonaprop soporta esto
  # (fetch_description); ML/Argenprop quedan para una iteración futura.
  max_new_descriptions_por_corrida: 300

fuentes:
  # Verificado con .github/workflows/test-f2-browsers.yml (corrida real en
  # Actions, no local): Zonaprop SÍ pasa el challenge de Cloudflare desde
  # una IP de datacenter (25/25 avisos reales). Argenprop NO — su WAF
  # devolvió 0 avisos desde Actions aunque local funciona perfecto. Hasta
  # investigar más (o resolverlo corriendo Argenprop localmente, como ya
  # preveía el plan), argenprop queda apagado en la corrida diaria.
  meli: true
  zonaprop: true
  argenprop: false
