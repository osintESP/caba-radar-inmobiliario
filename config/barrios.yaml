# Barrios monitoreados, por rol (PLAN-radar-inmobiliario.md, sección 5).
#
# meli_neighborhood_id se completa corriendo `uv run python -m ingest.meli_explore`
# una vez que exista un access_token válido (ver README): ese spike confirma qué
# parámetro de ubicación realmente filtra resultados en la API de Mercado Libre,
# y vuelca acá los IDs reales. No inventar estos valores de memoria.

nucleo:            # barrios de alerta activa
  - nombre: "Velez Sarsfield"
    meli_neighborhood_id: null
  - nombre: "Floresta"
    meli_neighborhood_id: null

propia:             # donde está la propiedad a vender
  - nombre: "Monte Castro"
    meli_neighborhood_id: null

anillo:             # solo para densificar el modelo, no genera alertas propias
  - nombre: "Flores"
    meli_neighborhood_id: null
  - nombre: "Villa Luro"
    meli_neighborhood_id: null
  - nombre: "Villa Santa Rita"
    meli_neighborhood_id: null
  - nombre: "Villa Real"
    meli_neighborhood_id: null
  - nombre: "Versalles"
    meli_neighborhood_id: null
  - nombre: "Villa del Parque"
    meli_neighborhood_id: null

tipologias:         # separadas siempre, nunca mezcladas en un comparable
  - "departamento"
  - "ph"
  - "casa"

outliers:
  usd_m2_min: 400
  usd_m2_max: 8000
