name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/latest.json"
      - "data/price_history.json"
      - "data/market_trends.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copiar JSON del sitio
        run: |
          mkdir -p site/data
          cp data/latest.json site/data/latest.json
          cp data/price_history.json site/data/price_history.json
          cp data/market_trends.json site/data/market_trends.json

      - name: Preparar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
