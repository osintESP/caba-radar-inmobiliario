# Scrapea la web pública de Mercado Libre (ver ingest/meli_scraper.py) —
# no requiere ningún secret de ML. ML_CLIENT_ID/ML_CLIENT_SECRET/
# ML_REFRESH_TOKEN quedan cargados en el repo por si en el futuro se
# retoma el flujo OAuth (API bloqueada hoy para apps no certificadas),
# pero este workflow no los usa.
#
# El deploy de Pages va DENTRO de este mismo job, después del commit: un
# push hecho con el GITHUB_TOKEN automático no dispara otros workflows
# (anti-loop de GitHub), así que un pages.yml separado nunca se hubiera
# disparado solo con la corrida diaria (confirmado en la práctica: el
# primer día el sitio quedó desactualizado). pages.yml se deja para cuando
# alguien pushea cambios de código del sitio a mano — ahí sí dispara.
name: Ingesta diaria

on:
  schedule:
    - cron: "0 13 * * *"  # ~10am ARG (UTC-3); el schedule de Actions es en UTC y no es puntual
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Instalar Chromium de Playwright
        run: uv run playwright install --with-deps chromium

      - name: Correr ingesta del día
        run: uv run python -m ingest.run_daily

      - name: Commit de snapshot y latest.json
        run: |
          git config user.name "radar-inmobiliario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots/ data/latest.json
          git diff --cached --quiet && echo "Sin cambios, no se commitea." || git commit -m "snapshot $(date -u +%F)"
          git push

      - name: Copiar latest.json al sitio
        run: |
          mkdir -p site/data
          cp data/latest.json site/data/latest.json

      - name: Preparar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
